version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      radix-ui:
        patterns: ["@radix-ui/*"]
      genkit:
        patterns: ["genkit", "genkit-cli", "@genkit-ai/*"]
  - package-ecosystem: pip
    directory: /analysis
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
