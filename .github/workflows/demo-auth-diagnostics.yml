# Temporary PR-scoped diagnostics; remove after resolving CircleCI web gate.
name: Synthetic Demo Authentication Diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnostic:
    name: Demo auth lint, types, Jest and build
    if: github.head_ref == 'security/demo-auth-guard-no-forwarded-ip-20261016'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Jest coverage
        run: npm run test:coverage -- --runInBand
      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ci-placeholder
