name: OT-Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage (thresholds in jest.config.ts)
        run: npm run test:coverage -- --runInBand

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ci-placeholder

  analysis:
    name: Analysis (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t ot-sentinel:ci .
