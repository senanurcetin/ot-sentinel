name: OT-Sentinel CI

# Automatic PR/push verification is handled by .circleci/config.yml.
# GitHub-hosted Actions minutes are unavailable; this workflow remains
# available only to deliberate manual invocations after budget restoration.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Lint, typecheck, test, build
    if: vars.ENABLE_GITHUB_ACTIONS_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage (thresholds in jest.config.ts)
        run: npm run test:coverage -- --runInBand

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ci-placeholder

  analysis:
    name: Analysis (ruff, pytest)
    if: vars.ENABLE_GITHUB_ACTIONS_CI == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  docker:
    name: Docker image builds
    if: vars.ENABLE_GITHUB_ACTIONS_CI == 'true'
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ot-sentinel:ci .
