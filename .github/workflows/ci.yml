name: OT-Sentinel CI

# CircleCI runs web and Python quality automatically. Keep GitHub's automatic
# Docker build as an independent integration gate; web/Python remain manually
# invokable for investigations without duplicating their runner minutes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, typecheck, test, build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage (thresholds in jest.config.ts)
        run: npm run test:coverage -- --runInBand

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ci-placeholder

  analysis:
    name: Analysis (ruff, pytest)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ot-sentinel:ci .

  maintenance-lock:
    name: Regenerate patched lockfile once
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/canonical-docs-no-hiring-briefs-20261026' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/canonical-docs-no-hiring-briefs-20261026
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Update compatible security fixes and exact lockfile
        run: |
          if [ "$(git log -1 --format=%s)" = "fix(deps): lock audited patched Next.js" ]; then
            echo "Lockfile already regenerated"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci --no-audit --no-fund
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): lock audited patched Next.js"
            git push origin HEAD:chore/canonical-docs-no-hiring-briefs-20261026
          fi
