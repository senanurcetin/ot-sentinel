# Temporary PR-only diagnostic; remove after identifying the CircleCI web gate.
name: Offline Replay CI Diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnostics:
    name: Offline replay lint, types and Jest diagnostic
    if: github.head_ref == 'feat/offline-replay-bounded-batch-review-20261016'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Jest and coverage
        run: npm run test:coverage -- --runInBand
      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ci-placeholder
