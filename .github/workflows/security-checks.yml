name: Security checks

# Automatic PR/push verification is handled by .circleci/config.yml.
# GitHub-hosted Actions minutes are unavailable; this workflow remains
# available only to deliberate manual invocations after budget restoration.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (production dependencies)
    if: vars.ENABLE_GITHUB_ACTIONS_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit
        # Gate on critical. Remaining high-severity advisories are transitive (Genkit/OpenTelemetry tree,
        # Tailwind build tooling) and tracked in DEPENDENCIES.md; Dependabot opens the upgrade PRs.
        run: npm audit --omit=dev --audit-level=critical

  codeql:
    name: CodeQL
    if: vars.ENABLE_GITHUB_ACTIONS_CI == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

  pip-audit:
    name: pip-audit (analysis dependencies)
    if: vars.ENABLE_GITHUB_ACTIONS_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Audit
        run: pip-audit -r analysis/requirements.txt

  secret-scan:
    name: Secret scan (gitleaks)
    if: vars.ENABLE_GITHUB_ACTIONS_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan history, not just the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
