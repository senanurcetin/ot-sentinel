name: Temporary BATADAL Hourly CI Diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnostic:
    name: BATADAL hourly Python Ruff and pytest diagnostic
    if: github.head_ref == 'feat/batadal-verified-hourly-2016-20261016'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analysis/requirements-dev.txt
      - name: Dependencies
        run: python -m pip install -r analysis/requirements-dev.txt
      - name: Ruff
        working-directory: analysis
        run: ruff check .
      - name: Pytest
        working-directory: analysis
        run: python -m pytest -q
