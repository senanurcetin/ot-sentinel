name: Release

# Pushing a tag like v0.2.0 publishes a GitHub Release whose notes are that version's CHANGELOG section.
# The tag must point at a commit that is on main (i.e. went through review and CI).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main; refusing to release"; exit 1; }

      - name: Notes from CHANGELOG
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
