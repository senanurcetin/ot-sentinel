name: Temporary publisher ZIP verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-proof:
    name: Verify official BATADAL 2017 ZIP SHA-256
    if: github.head_ref == 'feat/batadal-verified-2017-20261016'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Read-only publisher ZIP verification and bounded source output
        run: python3 analysis/export_official_test_hourly.py --emit-log
