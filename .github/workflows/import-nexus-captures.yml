name: Import verified NEXUS Chromium captures
on:
  push:
    branches:
      - docs/nexus-readme-captures-20261018

permissions:
  actions: read
  contents: write

jobs:
  import-captures:
    if: github.repository == 'senanurcetin/ot-sentinel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve exact pre-captured Chromium artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/12115205948/zip" -o "${RUNNER_TEMP}/nexus-captures.zip"
          unzip -t "${RUNNER_TEMP}/nexus-captures.zip"
          mkdir -p docs/assets
          unzip -jo "${RUNNER_TEMP}/nexus-captures.zip" \
            'nexus-dashboard-normal.png' \
            'nexus-dashboard-mobile.png' \
            'nexus-dashboard-attack.png' \
            'nexus-alert.png' \
            'nexus-forensic-report.png' -d docs/assets
          python3 - <<'PY'
          from pathlib import Path
          names = ['nexus-dashboard-normal.png', 'nexus-dashboard-mobile.png', 'nexus-dashboard-attack.png', 'nexus-alert.png', 'nexus-forensic-report.png']
          for name in names:
              data = (Path('docs/assets') / name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n' and 1000 < len(data) < 3_000_000, name
              print(name, len(data))
          PY
      - name: Version screenshot assets in this PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/nexus-dashboard-normal.png docs/assets/nexus-dashboard-mobile.png \
            docs/assets/nexus-dashboard-attack.png docs/assets/nexus-alert.png docs/assets/nexus-forensic-report.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(screenshots): attach verified NEXUS Chromium captures"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
