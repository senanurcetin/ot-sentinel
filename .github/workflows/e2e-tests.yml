name: E2E tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and starts the production server itself when CI is set.
      # GEMINI_API_KEY is a placeholder on purpose: the AI call fails and the tests verify the
      # dashboard's fallback guidance.
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          GEMINI_API_KEY: e2e-placeholder

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
