name: E2E tests

# Automatic PR/push verification is handled by .circleci/config.yml.
# GitHub-hosted Actions minutes are unavailable; this workflow remains
# available only to deliberate manual invocations after budget restoration.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (chromium)
    if: vars.ENABLE_GITHUB_ACTIONS_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and starts the production server itself when CI is set.
      # GEMINI_API_KEY is a placeholder on purpose: the AI call fails and the tests verify the
      # dashboard's fallback guidance.
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          GEMINI_API_KEY: e2e-placeholder

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
